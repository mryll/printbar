[package]
name = "printbar"
version = "0.5.2"
edition = "2021"
description = "A generic printer monitor for Waybar (IPP + SNMP) — any brand, network or USB"
license = "MIT"
repository = "https://github.com/mryll/printbar"
keywords = ["waybar", "printer", "ipp", "snmp", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2"
ipp = { version = "6", default-features = false, features = ["client"] }
# Same transport the ipp crate uses; declared directly so the IPP fetch can cap
# the body on the wire before the parser sees it (see src/sources/ipp.rs).
ureq = { version = "3", default-features = false }
snmp2 = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
unicode-width = "0.2"
# Only used to stamp the tooltip freshness footer with a local HH:MM, the same
# line every sibling widget ends its tooltip with.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "s"
