[package]
name = "printbar"
version = "0.1.0"
edition = "2021"
description = "A generic printer monitor for Waybar (IPP + SNMP) — any brand, network or USB"
license = "MIT"
repository = "https://github.com/mryll/printbar"
keywords = ["waybar", "printer", "ipp", "snmp", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
ipp = { version = "6", default-features = false, features = ["client"] }
snmp2 = { version = "0.5", default-features = false }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = "s"
